name = "cfb26-api"
main = "src/index.js"
compatibility_date = "2026-01-01"

# Filled in by tools/cf-setup.sh (npx wrangler d1 create cfb26)
[[d1_databases]]
binding = "DB"
database_name = "cfb26"
database_id = "39c6c034-aaa3-46ed-9a46-c93516852701"

[vars]
# Browser origins allowed to call this API (comma-separated).
ALLOWED_ORIGINS = "https://cfb26-master-primez.vercel.app,http://localhost:3000"
# Optional: Google OAuth client ID enables "Sign in with Google". Leave empty to hide it.
GOOGLE_CLIENT_ID = ""
